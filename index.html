<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de clientes · Vertag Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0EE; --surface:#FFFFFF; --ink:#101C2B; --ink2:#1B2A40;
    --muted:#5B6878; --line:#D8DEDB; --soft:#F5F7F6;
    --accent:#2540E8; --done:#0F8A5F; --bad:#C2362F;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--text)}
  h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.1}
  p{margin:0}
  a{color:var(--accent)}
  :focus-visible{outline:3px solid #8fa2ff;outline-offset:2px;border-radius:6px}
  button{font:inherit;color:inherit}

  /* ---------- estructura ---------- */
  .app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
  aside.side{background:var(--ink);color:#C9D3E3;padding:24px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:11px;padding:0 8px;color:#fff}
  .logo svg{flex:none}
  .logo b{font:700 19px/1 var(--display);letter-spacing:-.02em;display:block}
  .logo small{font-size:12px;color:#8C9AB3}
  .navlist{display:flex;flex-direction:column;gap:4px}
  .navbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C9D3E3;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:500}
  .navbtn:hover{background:var(--ink2);color:#fff}
  .navbtn.on{background:#fff;color:var(--ink)}
  .count{min-width:22px;text-align:center;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff}
  .navbtn.on .count{background:var(--ink);color:#fff}
  .sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px}
  .me{font-weight:600;color:#fff;word-break:break-word}
  .me small{display:block;font-weight:400;color:#8C9AB3}
  .sidefoot a{color:#C9D3E3;font-size:14px}
  .sidefoot button{background:none;border:1px solid #33435E;color:#C9D3E3;border-radius:8px;padding:7px 12px;cursor:pointer;text-align:left}
  .sidefoot button:hover{border-color:#8C9AB3;color:#fff}

  .page{padding:40px clamp(18px,4vw,56px) 70px;max-width:1160px;width:100%}
  .pagehead{margin-bottom:26px}
  .pagehead h1{font-size:clamp(28px,4vw,40px)}
  .lead{color:var(--muted);font-size:16px;margin-top:8px}
  .back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px}
  .back:hover{color:var(--ink)}

  /* ---------- etiquetas de estado ---------- */
  .tag{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 10px 3px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,white);white-space:nowrap}
  .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  .t-planificado,.t-cerrado,.t-baja{--c:#5B6878}
  .t-en_curso,.t-abierto{--c:#2540E8}
  .t-media{--c:#46618F}
  .t-en_pausa,.t-en_progreso{--c:#A86400}
  .t-esperando_cliente,.t-alta{--c:#C25100}
  .t-finalizado,.t-resuelto{--c:#0F8A5F}
  .t-urgente{--c:#C2362F}

  /* ---------- riel de etapas (la línea de proceso) ---------- */
  .rail{display:flex;gap:5px}
  .seg{flex:1;height:12px;border-radius:3px;background:#DDE3E0;position:relative}
  .seg.done{background:var(--done)}
  .seg.now{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  .rail.empty .seg{background:repeating-linear-gradient(135deg,#DDE3E0 0 6px,#EDF0EE 6px 12px)}

  /* ---------- proyectos ---------- */
  .projlist{display:flex;flex-direction:column;gap:12px}
  .proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px 36px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px;cursor:pointer}
  .proj:hover{border-color:var(--ink)}
  .proj h3{font-size:22px}
  .proj .who{color:var(--muted);margin-top:2px}
  .proj .tag{margin-top:10px}
  .stage{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted)}
  .stage b{color:var(--ink);font-weight:600}

  .split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:18px;align-items:start}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
  .panel h2{font-size:20px;margin-bottom:16px}
  .phead{margin-bottom:22px}
  .phead .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
  .phead h1{font-size:clamp(28px,4vw,40px)}
  .phead p{color:var(--muted);margin-top:10px;max-width:62ch;white-space:pre-wrap}
  .pct{font:700 44px/1 var(--display);letter-spacing:-.03em}
  .facts{display:grid;gap:10px;margin:18px 0 20px}
  .facts div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
  .facts span{color:var(--muted)}
  .facts b{font-weight:600;text-align:right}

  .steps{list-style:none;margin:0;padding:0;position:relative}
  .steps::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
  .step{position:relative;display:grid;grid-template-columns:24px 1fr;gap:14px;padding:11px 0}
  .node{width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid #B9C3BE;display:grid;place-items:center;position:relative;z-index:1;font-size:13px;line-height:1;color:#fff}
  .step.done .node{background:var(--done);border-color:var(--done)}
  .step.now .node{border-color:var(--accent);box-shadow:0 0 0 4px #DCE2FF}
  .step.late .node{border-color:var(--bad)}
  .step h3{font:600 16px/1.3 var(--text);letter-spacing:0}
  .step .d{color:var(--muted);font-size:14px;margin-top:2px;white-space:pre-wrap}
  .step .when{color:var(--muted);font-size:14px;margin-top:2px}
  .step.late .when{color:var(--bad);font-weight:500}
  .step .tag{margin-left:8px;vertical-align:2px}
  .chk{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:14px;cursor:pointer}
  .chk input{width:17px;height:17px;accent-color:var(--done)}

  /* ---------- soporte ---------- */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .seg2{display:inline-flex;background:#DDE3E0;border-radius:10px;padding:3px}
  .seg2 button{background:none;border:0;padding:7px 16px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
  .seg2 button.on{background:var(--surface);color:var(--ink)}
  .tickets{display:flex;flex-direction:column;gap:10px}
  .tk{--c:var(--muted);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:15px 20px;cursor:pointer}
  .tk:hover{border-color:var(--ink);border-left-color:var(--c)}
  .tk strong{font-weight:600;font-size:16px}
  .tk .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--muted);font-size:14px}
  .tk .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .bub{max-width:88%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--soft);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .bub small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
  .bub.mine{align-self:flex-end;border-radius:14px 14px 4px 14px;background:#E6EAFF;border-color:#C7D0FF}
  .bub.internal{background:#FFF4DC;border:1px dashed #D9A441}
  .desc{white-space:pre-wrap;word-break:break-word;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}

  /* ---------- formularios y botones ---------- */
  label{display:block;font-size:14px;font-weight:500;margin:14px 0 5px}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid #B9C3BE;color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
  input:focus,select:focus,textarea:focus{outline:3px solid #8fa2ff;outline-offset:0;border-color:var(--accent)}
  textarea{min-height:100px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-weight:600;cursor:pointer}
  .btn:hover{background:#1B33C4}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.block{width:100%}
  .ghost{background:var(--surface);border:1px solid #B9C3BE;border-radius:9px;padding:9px 16px;font-weight:500;cursor:pointer}
  .ghost:hover{border-color:var(--ink)}
  .linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
  .formrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
  .chk2{display:flex;align-items:center;gap:8px;font-weight:400;margin:0}
  .chk2 input{width:auto}
  .empty{background:var(--surface);border:1px dashed #B9C3BE;border-radius:16px;padding:38px 24px;text-align:center;color:var(--muted)}
  .empty p{max-width:46ch;margin:0 auto 16px}

  /* ---------- acceso ---------- */
  .auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
  .auth-brand{background:var(--ink);color:#fff;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
  .auth-brand h1{font-size:clamp(34px,5vw,58px);line-height:1.02;max-width:12ch}
  .auth-brand p{color:#A9B6CC;max-width:38ch;margin-top:18px}
  .auth-form{display:flex;align-items:center;justify-content:center;padding:36px 24px}
  .auth-form form{width:100%;max-width:380px}
  .auth-form h2{font-size:28px;margin-bottom:6px}
  .auth-form .lead{margin:0 0 10px}
  .auth-form .linkrow{margin-top:14px;text-align:center}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;display:none;z-index:50;max-width:90vw}
  #toast.err{background:var(--bad)} #toast.show{display:block}

  /* ---------- responsive ---------- */
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 16px}
    .navlist{flex-direction:row;order:3;width:100%}
    .navbtn{justify-content:center;flex:1}
    .sidefoot{margin:0 0 0 auto;flex-direction:row;align-items:center;order:2}
    .sidefoot .me,.sidefoot a{display:none}
    .split{grid-template-columns:1fr}
    .proj{grid-template-columns:1fr}
    .auth{grid-template-columns:1fr}
    .auth-brand{padding:28px 24px;gap:24px}
    .auth-brand h1{max-width:none}
  }
  @media(max-width:560px){.two{grid-template-columns:1fr} .tk{grid-template-columns:1fr} .tk .tags{justify-content:flex-start}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN
   Usá la clave publishable (pública). NUNCA pongas la "secret"/"service_role" acá.
   ===================================================================== */
const SUPABASE_URL      = 'https://krvwdjzhknoulekvbdgb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0Tj2xN2sc63998srKWfJiw_a6DnzfAm';
const WHATSAPP_VERTAG   = '5493764380293';

/* ---------- utilidades ---------- */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $  = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => { if (!d) return 'sin fecha'; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const fmtT = t => new Date(t).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
const todayStr = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 3500);
}

const L = {
  proyecto: { planificado:'Planificado', en_curso:'En curso', en_pausa:'En pausa', finalizado:'Finalizado' },
  ticket:   { abierto:'Abierto', en_progreso:'En progreso', esperando_cliente:'Esperando cliente', resuelto:'Resuelto', cerrado:'Cerrado' },
  tipo:     { mantenimiento:'Mantenimiento', mejora:'Mejora', error:'Error', consulta:'Consulta' },
  prioridad:{ baja:'Baja', media:'Media', alta:'Alta', urgente:'Urgente' }
};
const tag = (txt, key) => `<span class="tag t-${esc(key)}">${esc(txt)}</span>`;

const LOGO = `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2540E8"/><path d="M8.5 9.5 16 23l7.5-13.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- estado ---------- */
// Si el usuario llega desde un mail de invitación o de recuperación, hay que pedirle que cree su contraseña.
const NEEDS_PASSWORD = /type=(invite|recovery)/.test(location.hash);
const S = {
  session: null, perfil: null, clienteNombre: '',
  proyectos: [], hitosAll: {}, tickets: [], clientes: {}, perfiles: {},
  view: 'proyectos', projectId: null, hitos: [], ticketId: null, comentarios: [],
  showForm: false, formProyecto: '', soloActivos: true, passwordDone: false
};
const isAdmin = () => S.perfil?.rol === 'admin';
const openCount = () => S.tickets.filter(t => !['resuelto','cerrado'].includes(t.estado)).length;
const firstName = () => {
  const n = (S.perfil.nombre || S.perfil.email || '').split('@')[0].trim().split(/\s+/)[0];
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
};

/* ---------- arranque ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  S.session = session;
  if (!session) return renderLogin();
  if (NEEDS_PASSWORD && !S.passwordDone) return renderSetPassword();
  await loadAll();
}
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.session = null; S.perfil = null; renderLogin(); } });

async function loadAll() {
  const uid = S.session.user.id;
  const { data: perfil, error } = await sb.from('perfiles').select('id,rol,nombre,email,cliente_id').eq('id', uid).single();
  if (error || !perfil) { toast('No pudimos cargar tu perfil. Probá ingresar de nuevo.', true); return renderLogin(); }
  S.perfil = perfil;
  if (!isAdmin() && !perfil.cliente_id) return renderSinCliente();

  if (perfil.cliente_id) {
    const { data: c } = await sb.from('clientes').select('nombre').eq('id', perfil.cliente_id).maybeSingle();
    S.clienteNombre = c?.nombre || '';
  }
  const [p, t, h] = await Promise.all([
    sb.from('v_proyectos_resumen').select('*').order('updated_at', { ascending: false }),
    sb.from('tickets').select('*, proyectos(nombre)').order('created_at', { ascending: false }),
    sb.from('hitos').select('id,proyecto_id,orden,nombre,completado,fecha_objetivo').order('orden')
  ]);
  const err = p.error || t.error || h.error;
  if (err) toast(err.message, true);
  S.proyectos = p.data || []; S.tickets = t.data || [];
  groupHitos(h.data || []);

  if (isAdmin()) {
    const [c, pf] = await Promise.all([
      sb.from('clientes').select('id,nombre'),
      sb.from('perfiles').select('id,nombre,email,rol')
    ]);
    S.clientes = Object.fromEntries((c.data || []).map(x => [x.id, x.nombre]));
    S.perfiles = Object.fromEntries((pf.data || []).map(x => [x.id, x]));
  }
  render();
}
function groupHitos(rows) {
  S.hitosAll = {};
  rows.forEach(h => (S.hitosAll[h.proyecto_id] ||= []).push(h));
}

/* ---------- pantallas de acceso ---------- */
function authShell(title, lead, formHtml) {
  $('#app').innerHTML = `
    <div class="auth">
      <section class="auth-brand">
        <div class="logo">${LOGO}<div><b>Vertag</b><small>Solutions</small></div></div>
        <div>
          <h1>Eficiencia, tecnología y capital.</h1>
          <p>Seguí el avance de tus proyectos y pedí soporte desde un solo lugar.</p>
        </div>
        <small style="color:#8C9AB3">Portal de clientes</small>
      </section>
      <section class="auth-form">${formHtml}</section>
    </div>`;
}
function renderLogin() {
  authShell('', '', `
    <form data-form="login">
      <h2>Ingresá a tu portal</h2>
      <p class="lead">Usá el email con el que te invitamos.</p>
      <label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="username">
      <label for="pass">Contraseña</label><input id="pass" type="password" name="password" required autocomplete="current-password">
      <div class="formrow"><button class="btn block">Ingresar</button></div>
      <p class="linkrow"><button type="button" class="linkbtn" data-action="reset">Olvidé mi contraseña</button></p>
    </form>`);
}
function renderSetPassword() {
  authShell('', '', `
    <form data-form="setpass">
      <h2>Creá tu contraseña</h2>
      <p class="lead">Con ella vas a ingresar al portal.</p>
      <label for="p1">Contraseña (mínimo 8 caracteres)</label>
      <input id="p1" type="password" name="p1" minlength="8" required autocomplete="new-password">
      <label for="p2">Repetila</label>
      <input id="p2" type="password" name="p2" minlength="8" required autocomplete="new-password">
      <div class="formrow"><button class="btn block">Guardar y entrar</button></div>
    </form>`);
}
function renderSinCliente() {
  authShell('', '', `
    <div style="max-width:380px">
      <h2 style="font-size:28px;margin-bottom:8px">Tu cuenta está casi lista</h2>
      <p class="lead">Todavía no está vinculada a una empresa. Escribinos y la activamos.</p>
      <div class="formrow" style="justify-content:flex-start">
        <a class="btn" style="text-decoration:none" href="https://wa.me/${WHATSAPP_VERTAG}" target="_blank" rel="noopener">Escribir por WhatsApp</a>
        <button class="ghost" data-action="logout">Cerrar sesión</button>
      </div>
    </div>`);
}

/* ---------- estructura principal ---------- */
function render() {
  const abiertos = openCount();
  $('#app').innerHTML = `
    <div class="app">
      <aside class="side">
        <div class="logo">${LOGO}<div><b>Vertag</b><small>Solutions</small></div></div>
        <nav class="navlist" aria-label="Secciones">
          <button class="navbtn ${S.view === 'proyectos' ? 'on' : ''}" data-action="tab" data-v="proyectos">Proyectos</button>
          <button class="navbtn ${S.view === 'tickets' ? 'on' : ''}" data-action="tab" data-v="tickets">Soporte${abiertos ? `<span class="count">${abiertos}</span>` : ''}</button>
        </nav>
        <div class="sidefoot">
          <div class="me">${esc(S.perfil.nombre || S.perfil.email || '')}<small>${isAdmin() ? 'Administración Vertag' : esc(S.clienteNombre)}</small></div>
          <a href="https://wa.me/${WHATSAPP_VERTAG}" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
          <button data-action="logout">Salir</button>
        </div>
      </aside>
      <main class="page">${S.view === 'proyectos' ? (S.projectId ? vProyecto() : vProyectos()) : (S.ticketId ? vTicket() : vTickets())}</main>
    </div>`;
}

/* ---------- proyectos ---------- */
const hitosDe = pid => S.hitosAll[pid] || [];
const etapaActual = pid => hitosDe(pid).find(h => !h.completado);
function rail(pid) {
  const hs = hitosDe(pid);
  if (!hs.length) return `<div class="rail empty" role="img" aria-label="Sin etapas cargadas"><i class="seg"></i></div>`;
  const cur = etapaActual(pid);
  const hechas = hs.filter(h => h.completado).length;
  return `<div class="rail" role="img" aria-label="${hechas} de ${hs.length} etapas completadas">${hs.map(h =>
    `<i class="seg${h.completado ? ' done' : ''}${cur && cur.id === h.id ? ' now' : ''}" title="${esc(h.nombre)}"></i>`).join('')}</div>`;
}
function resumen() {
  const act = S.proyectos.filter(p => p.estado === 'en_curso').length;
  const ab = openCount();
  return isAdmin()
    ? `Hay ${plural(act, 'proyecto en curso', 'proyectos en curso')} y ${plural(ab, 'solicitud por atender', 'solicitudes por atender')}.`
    : `Tenés ${plural(act, 'proyecto en curso', 'proyectos en curso')} y ${plural(ab, 'solicitud abierta', 'solicitudes abiertas')}.`;
}

function vProyectos() {
  const head = `<div class="pagehead"><h1>Hola, ${esc(firstName())}</h1><p class="lead">${resumen()}</p></div>`;
  if (!S.proyectos.length) return head + `<div class="empty"><p>Todavía no hay proyectos cargados. Cuando empecemos a trabajar juntos, vas a ver el avance acá.</p></div>`;
  return head + `<div class="projlist">${S.proyectos.map(p => {
    const cur = etapaActual(p.id);
    const total = hitosDe(p.id).length;
    return `
    <article class="proj" role="button" tabindex="0" data-action="open-project" data-id="${esc(p.id)}">
      <div>
        <h3>${esc(p.nombre)}</h3>
        ${isAdmin() ? `<p class="who">${esc(S.clientes[p.cliente_id] || '')}</p>` : ''}
        ${tag(L.proyecto[p.estado], p.estado)}
      </div>
      <div>
        ${rail(p.id)}
        <div class="stage">
          <span>${total ? (cur ? `<b>Etapa actual:</b> ${esc(cur.nombre)}` : '<b>Todas las etapas completadas</b>') : 'Todavía sin etapas cargadas'}</span>
          ${p.proximo_hito_fecha ? `<span>Próximo hito el ${fmtD(p.proximo_hito_fecha)}</span>` : ''}
        </div>
      </div>
    </article>`;
  }).join('')}</div>`;
}

function vProyecto() {
  const p = S.proyectos.find(x => x.id === S.projectId);
  if (!p) return '';
  const hoy = todayStr();
  const cur = S.hitos.find(h => !h.completado);
  return `
    <button class="back" data-action="back-project">${CHEV} Volver a proyectos</button>
    <div class="phead">
      <div class="row"><h1>${esc(p.nombre)}</h1>${tag(L.proyecto[p.estado], p.estado)}</div>
      ${isAdmin() ? `<p style="margin-top:6px">${esc(S.clientes[p.cliente_id] || '')}</p>` : ''}
      ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
    </div>
    <div class="split">
      <section class="panel">
        <h2>Etapas del proyecto</h2>
        ${S.hitos.length ? `<ol class="steps">${S.hitos.map(h => {
          const late = !h.completado && h.fecha_objetivo && h.fecha_objetivo < hoy;
          const now = cur && cur.id === h.id;
          return `<li class="step ${h.completado ? 'done' : ''} ${now ? 'now' : ''} ${late ? 'late' : ''}">
            <span class="node">${h.completado ? '✓' : ''}</span>
            <div>
              <h3>${esc(h.nombre)}${now ? `<span class="tag t-en_curso">Etapa actual</span>` : ''}</h3>
              ${h.descripcion ? `<p class="d">${esc(h.descripcion)}</p>` : ''}
              <p class="when">${h.completado ? 'Completada el ' + fmtT(h.completado_en) : (late ? 'Vencida, objetivo el ' : 'Objetivo: ') + fmtD(h.fecha_objetivo)}</p>
              ${isAdmin() ? `<label class="chk"><input type="checkbox" data-action="toggle-hito" data-id="${esc(h.id)}" ${h.completado ? 'checked' : ''}> Marcar como completada</label>` : ''}
            </div>
          </li>`;
        }).join('')}</ol>` : `<p style="color:var(--muted)">Este proyecto todavía no tiene etapas cargadas.</p>`}
      </section>
      <section class="panel">
        <div class="pct">${Number(p.avance) || 0}%</div>
        <p style="color:var(--muted);margin:4px 0 14px">completado</p>
        ${rail(p.id)}
        <div class="facts">
          <div><span>Etapas completadas</span><b>${p.hitos_completados} de ${p.hitos_total}</b></div>
          <div><span>Inicio</span><b>${fmtD(p.fecha_inicio)}</b></div>
          <div><span>Fin estimado</span><b>${fmtD(p.fecha_fin_estimada)}</b></div>
        </div>
        ${!isAdmin() ? `<button class="btn block" data-action="ticket-from-project" data-id="${esc(p.id)}">Pedir soporte sobre este proyecto</button>` : ''}
      </section>
    </div>`;
}

/* ---------- soporte ---------- */
function vTickets() {
  const lista = S.tickets.filter(t => !S.soloActivos || !['resuelto','cerrado'].includes(t.estado));
  return `
    <div class="pagehead"><h1>Soporte</h1>
      <p class="lead">${isAdmin() ? 'Solicitudes de todos los clientes.' : 'Pedí mantenimiento, mejoras o ayuda y seguí cada solicitud hasta que se resuelva.'}</p></div>
    <div class="toolbar">
      <div class="seg2" role="group" aria-label="Filtro">
        <button class="${S.soloActivos ? 'on' : ''}" data-action="filtro" data-v="1">Activas</button>
        <button class="${!S.soloActivos ? 'on' : ''}" data-action="filtro" data-v="0">Todas</button>
      </div>
      ${!isAdmin() ? `<button class="btn" data-action="toggle-form">${S.showForm ? 'Cancelar' : 'Nueva solicitud'}</button>` : ''}
    </div>
    ${S.showForm && !isAdmin() ? formTicket() : ''}
    ${lista.length ? `<div class="tickets">${lista.map(t => `
      <article class="tk t-${esc(t.estado)}" role="button" tabindex="0" data-action="open-ticket" data-id="${esc(t.id)}">
        <strong>${esc(t.titulo)}</strong>
        <div class="tags">${tag(L.ticket[t.estado], t.estado)}${tag('Prioridad ' + L.prioridad[t.prioridad].toLowerCase(), t.prioridad)}</div>
        <div class="meta">
          ${isAdmin() ? `<span>${esc(S.clientes[t.cliente_id] || '')}</span>` : ''}
          <span>${esc(L.tipo[t.tipo])}</span>
          ${t.proyectos?.nombre ? `<span>${esc(t.proyectos.nombre)}</span>` : ''}
          <span>${fmtT(t.created_at)}</span>
        </div>
      </article>`).join('')}</div>`
    : `<div class="empty"><p>${S.soloActivos ? 'No hay solicitudes activas.' : 'Todavía no hay solicitudes.'}${!isAdmin() ? ' Si algo no funciona o querés un cambio, creá una nueva.' : ''}</p>
        ${!isAdmin() && !S.showForm ? `<button class="btn" data-action="toggle-form">Nueva solicitud</button>` : ''}</div>`}`;
}

function formTicket() {
  return `
    <form class="panel" data-form="ticket" style="margin-bottom:18px">
      <h2>Nueva solicitud</h2>
      <label for="tt">Título</label><input id="tt" name="titulo" maxlength="140" required placeholder="Ej: No puedo cargar un alumno nuevo">
      <div class="two">
        <div><label for="tp">Tipo</label><select id="tp" name="tipo">${Object.entries(L.tipo).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
        <div><label for="pr">Prioridad</label><select id="pr" name="prioridad">${Object.entries(L.prioridad).map(([k,v]) => `<option value="${k}" ${k==='media'?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <label for="pj">Proyecto</label>
      <select id="pj" name="proyecto_id"><option value="">General, no es de un proyecto</option>
        ${S.proyectos.map(p => `<option value="${esc(p.id)}" ${S.formProyecto === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}
      </select>
      <label for="ds">Descripción</label><textarea id="ds" name="descripcion" placeholder="Contanos qué pasa o qué necesitás, con el mayor detalle posible"></textarea>
      <div class="formrow" style="justify-content:flex-end"><button class="btn">Enviar solicitud</button></div>
    </form>`;
}

function vTicket() {
  const t = S.tickets.find(x => x.id === S.ticketId);
  if (!t) return '';
  const quien = id => {
    if (id === S.session.user.id) return isAdmin() ? 'Vertag (vos)' : 'Vos';
    if (isAdmin()) { const p = S.perfiles[id]; return p ? `${p.nombre || p.email}${p.rol === 'admin' ? ' (Vertag)' : ''}` : 'Cliente'; }
    return 'Vertag';
  };
  return `
    <button class="back" data-action="back-ticket">${CHEV} Volver a soporte</button>
    <div class="phead"><h1>${esc(t.titulo)}</h1></div>
    <div class="split">
      <section class="panel">
        ${t.descripcion ? `<div class="desc">${esc(t.descripcion)}</div>` : ''}
        <h2>Conversación</h2>
        <div class="chat">
          ${S.comentarios.length ? S.comentarios.map(c => `
            <div class="bub ${c.interno ? 'internal' : c.autor_id === S.session.user.id ? 'mine' : ''}">
              <small>${esc(quien(c.autor_id))}${c.interno ? ', nota interna' : ''} · ${fmtT(c.created_at)}</small>${esc(c.mensaje)}
            </div>`).join('') : `<p style="color:var(--muted)">Todavía no hay mensajes. Vas a ver acá nuestras respuestas.</p>`}
        </div>
        ${t.estado === 'cerrado' && !isAdmin() ? `<p style="color:var(--muted)">Esta solicitud está cerrada. Si necesitás algo más, creá una nueva.</p>` : `
        <form data-form="comment">
          <label for="msg" style="margin-top:0">Escribir un mensaje</label>
          <textarea id="msg" name="mensaje" required style="min-height:80px"></textarea>
          <div class="formrow">
            ${isAdmin() ? `<label class="chk2"><input type="checkbox" name="interno"> Nota interna, el cliente no la ve</label>` : '<span></span>'}
            <button class="btn">Enviar mensaje</button>
          </div>
        </form>`}
      </section>
      <section class="panel">
        <div class="facts" style="margin-top:0">
          <div><span>Estado</span>${tag(L.ticket[t.estado], t.estado)}</div>
          <div><span>Prioridad</span>${tag(L.prioridad[t.prioridad], t.prioridad)}</div>
          <div><span>Tipo</span><b>${esc(L.tipo[t.tipo])}</b></div>
          ${t.proyectos?.nombre ? `<div><span>Proyecto</span><b>${esc(t.proyectos.nombre)}</b></div>` : ''}
          ${isAdmin() ? `<div><span>Cliente</span><b>${esc(S.clientes[t.cliente_id] || '')}</b></div>` : ''}
          <div><span>Creada</span><b>${fmtT(t.created_at)}</b></div>
        </div>
        ${isAdmin() ? `<label for="est" style="margin-top:0">Cambiar estado</label>
          <select id="est" data-action="set-estado" data-id="${esc(t.id)}">
            ${Object.entries(L.ticket).map(([k,v]) => `<option value="${k}" ${t.estado === k ? 'selected' : ''}>${v}</option>`).join('')}
          </select>` : ''}
      </section>
    </div>`;
}

/* ---------- acciones ---------- */
async function openProject(id) {
  S.projectId = id;
  const { data, error } = await sb.from('hitos').select('*').eq('proyecto_id', id).order('orden');
  if (error) toast(error.message, true);
  S.hitos = data || []; render(); window.scrollTo(0, 0);
}
async function openTicket(id) {
  S.ticketId = id; await loadComentarios(); render(); window.scrollTo(0, 0);
}
async function loadComentarios() {
  const { data, error } = await sb.from('ticket_comentarios').select('*').eq('ticket_id', S.ticketId).order('created_at');
  if (error) toast(error.message, true);
  S.comentarios = data || [];
}
async function refreshProyectos() {
  const [p, h] = await Promise.all([
    sb.from('v_proyectos_resumen').select('*').order('updated_at', { ascending: false }),
    sb.from('hitos').select('id,proyecto_id,orden,nombre,completado,fecha_objetivo').order('orden')
  ]);
  S.proyectos = p.data || []; groupHitos(h.data || []);
}
async function refreshTickets() {
  const { data } = await sb.from('tickets').select('*, proyectos(nombre)').order('created_at', { ascending: false });
  S.tickets = data || [];
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'toggle-hito' || a === 'set-estado') return; // se manejan en "change"
  if (a === 'logout') { await sb.auth.signOut(); }
  else if (a === 'tab') { S.view = el.dataset.v; S.projectId = null; S.ticketId = null; render(); }
  else if (a === 'open-project') openProject(el.dataset.id);
  else if (a === 'back-project') { S.projectId = null; render(); }
  else if (a === 'open-ticket') openTicket(el.dataset.id);
  else if (a === 'back-ticket') { S.ticketId = null; render(); }
  else if (a === 'filtro') { S.soloActivos = el.dataset.v === '1'; render(); }
  else if (a === 'toggle-form') { S.showForm = !S.showForm; S.formProyecto = ''; render(); }
  else if (a === 'ticket-from-project') { S.view = 'tickets'; S.ticketId = null; S.showForm = true; S.formProyecto = el.dataset.id; render(); window.scrollTo(0, 0); }
  else if (a === 'reset') {
    const email = prompt('Escribí tu email y te mandamos un link para crear una nueva contraseña:');
    if (!email) return;
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname });
    toast(error ? error.message : 'Listo, revisá tu correo.', !!error);
  }
});

// Accesibilidad: las filas clickeables también se abren con Enter o Espacio
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-action]')) {
    e.preventDefault(); e.target.click();
  }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'set-estado') {
    const { error } = await sb.from('tickets').update({ estado: el.value }).eq('id', el.dataset.id);
    if (error) return toast(error.message, true);
    await refreshTickets(); render(); toast('Estado actualizado');
  }
  else if (a === 'toggle-hito') {
    const { error } = await sb.from('hitos').update({ completado: el.checked }).eq('id', el.dataset.id);
    if (error) { toast(error.message, true); el.checked = !el.checked; return; }
    const { data } = await sb.from('hitos').select('*').eq('proyecto_id', S.projectId).order('orden');
    S.hitos = data || [];
    await refreshProyectos(); render(); toast('Etapa actualizada');
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('button.btn'); if (btn) btn.disabled = true;
  const fd = new FormData(f);
  try {
    const kind = f.dataset.form;
    if (kind === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: fd.get('email').trim(), password: fd.get('password') });
      if (error) { toast('El email o la contraseña no son correctos', true); return; }
      S.session = (await sb.auth.getSession()).data.session; await loadAll();
    }
    else if (kind === 'setpass') {
      if (fd.get('p1') !== fd.get('p2')) { toast('Las contraseñas no coinciden', true); return; }
      const { error } = await sb.auth.updateUser({ password: fd.get('p1') });
      if (error) { toast(error.message, true); return; }
      S.passwordDone = true; history.replaceState(null, '', location.pathname);
      toast('Contraseña creada'); await loadAll();
    }
    else if (kind === 'ticket') {
      const row = {
        cliente_id: S.perfil.cliente_id, creado_por: S.session.user.id, estado: 'abierto',
        tipo: fd.get('tipo'), prioridad: fd.get('prioridad'),
        titulo: fd.get('titulo').trim(), descripcion: fd.get('descripcion').trim() || null,
        proyecto_id: fd.get('proyecto_id') || null
      };
      const { error } = await sb.from('tickets').insert(row);
      if (error) { toast(error.message, true); return; }
      S.showForm = false; S.formProyecto = ''; await refreshTickets(); render();
      toast('Solicitud enviada');
    }
    else if (kind === 'comment') {
      const row = {
        ticket_id: S.ticketId, autor_id: S.session.user.id,
        mensaje: fd.get('mensaje').trim(), interno: isAdmin() && fd.get('interno') === 'on'
      };
      const { error } = await sb.from('ticket_comentarios').insert(row);
      if (error) { toast(error.message, true); return; }
      await loadComentarios(); render(); toast('Mensaje enviado');
    }
  } finally { if (btn) btn.disabled = false; }
});

boot();
</script>
</body>
</html>
